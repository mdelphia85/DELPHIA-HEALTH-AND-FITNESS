name: Validate Kivy KV

on:
  push:
    paths:
      - 'apps/delphia/kivy/**'
  pull_request:
    paths:
      - 'apps/delphia/kivy/**'

jobs:
  validate-kv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/delphia/kivy/requirements.txt
      - name: Run KV validator
        run: python apps/delphia/kivy/validate_kv.py
